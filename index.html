              <div class="overlay-title" id="title2048">2048 REACHED!</div>
              <p class="overlay-subtitle" id="sub2048">You forged the 2048 Neon Core!</p>
              <div class="overlay-btn-row" id="btns2048"></div>
            </div>
          </div>
        `;

        this.boardEl = this.mount.querySelector('#board2048');
        this.overlay = this.mount.querySelector('#overlay2048');
        this.overlayTitle = this.mount.querySelector('#title2048');
        this.overlaySub = this.mount.querySelector('#sub2048');
        this.overlayBtns = this.mount.querySelector('#btns2048');
      }

      reset() {
        this.grid = Array.from({ length: 4 }, () => Array(4).fill(0));
        this.score = 0;
        this.won = false;
        this.keepPlaying = false;
        this.isGameOver = false;
        this.overlay.classList.add('hidden');

        this.addRandomTile();
        this.addRandomTile();
        this.updateHUD();
        this.render();
      }

      addRandomTile() {
        const empty = [];
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            if (this.grid[r][c] === 0) empty.push([r, c]);
          }
        }
        if (empty.length === 0) return null;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        this.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        return `${r}-${c}`;
      }

      slideRowLeft(row) {
        const filtered = row.filter(v => v !== 0);
        const result = [];
        let gained = 0;
        for (let i = 0; i < filtered.length; i++) {
          if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
            const merged = filtered[i] * 2;
            result.push(merged);
            gained += merged;
            if (merged === 2048 && !this.won && !this.keepPlaying) {
              this.won = true;
            }
            i++;
          } else {
            result.push(filtered[i]);
          }
        }
        while (result.length < 4) result.push(0);
        return { row: result, gained };
      }

      move(direction) {
        if (this.isGameOver || (!this.overlay.classList.contains('hidden'))) return;

        const prev = JSON.stringify(this.grid);
        let totalGained = 0;

        const rotateClockwise = (m) => m[0].map((_, idx) => m.map(row => row[idx]).reverse());
        const rotateCounterClockwise = (m) => m[0].map((_, idx) => m.map(row => row[row.length - 1 - idx]));

        let working = this.grid.map(r => [...r]);

        if (direction === 'UP') working = rotateCounterClockwise(working);
        if (direction === 'RIGHT') working = working.map(r => [...r].reverse());
        if (direction === 'DOWN') working = rotateClockwise(working);

        working = working.map(r => {
          const { row, gained } = this.slideRowLeft(r);
          totalGained += gained;
          return row;
        });

        if (direction === 'UP') working = rotateClockwise(working);
        if (direction === 'RIGHT') working = working.map(r => [...r].reverse());
        if (direction === 'DOWN') working = rotateCounterClockwise(working);

        if (JSON.stringify(working) !== prev) {
          this.grid = working;
          this.score += totalGained;
          const spawnedKey = this.addRandomTile();

          if (totalGained > 0) {
            this.sound.play('merge');
          } else {
            this.sound.play('blip');
          }

          const best = this.storage.setHighScore(this.gameId, this.score);
          this.onHighScore(this.gameId, best);
          this.updateHUD();
          this.render(spawnedKey);

          if (this.won && !this.keepPlaying) {
            this.sound.play('win');
            this.showOverlay(
              '2048 REACHED!',
              'Incredible! Continue playing for an even higher score or start fresh.',
              true
            );
          } else if (!this.canMove()) {
            this.isGameOver = true;
            this.sound.play('gameover');
            this.showOverlay(
              'NO MOVES LEFT',
              `Final Score: ${this.score}. Ready for another run?`,
              false
            );
          }
        }
      }

      canMove() {
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            const val = this.grid[r][c];
            if (val === 0) return true;
            if (c < 3 && val === this.grid[r][c + 1]) return true;
            if (r < 3 && val === this.grid[r + 1][c]) return true;
          }
        }
        return false;
      }

      showOverlay(title, subtitle, allowContinue) {
        this.overlayTitle.textContent = title;
        this.overlaySub.textContent = subtitle;
        this.overlayBtns.innerHTML = '';

        if (allowContinue) {
          const contBtn = document.createElement('button');
          contBtn.type = 'button';
          contBtn.className = 'btn-play';
          contBtn.textContent = 'KEEP GOING';
          contBtn.onclick = () => {
            this.keepPlaying = true;
            this.overlay.classList.add('hidden');
          };
          this.overlayBtns.appendChild(contBtn);
        }

        const restartBtn = document.createElement('button');
        restartBtn.type = 'button';
        restartBtn.className = 'btn-play';
        restartBtn.textContent = 'NEW GAME';
        restartBtn.onclick = () => this.reset();
        this.overlayBtns.appendChild(restartBtn);

        this.overlay.classList.remove('hidden');
      }

      updateHUD() {
        const best = this.storage.getHighScore(this.gameId);
        const maxTile = Math.max(...this.grid.flat());
        this.hud.innerHTML = `
          <div class="hud-stat"><span class="hud-label">Score</span><span class="hud-value">${this.score}</span></div>
          <div class="hud-stat"><span class="hud-label">Best</span><span class="hud-value best">${best}</span></div>
          <div class="hud-stat"><span class="hud-label">Max Tile</span><span class="hud-value" style="color:#ffb800;">${maxTile}</span></div>
        `;
      }

      render(popKey = null) {
        this.boardEl.innerHTML = '';
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            const val = this.grid[r][c];
            const tile = document.createElement('div');
            tile.className = 'tile-2048' + (popKey === `${r}-${c}` ? ' pop' : '');
            if (val > 0) {
              const style = this.tileStyles[val] || { bg: '#ff3b5c', fg: '#ffffff', glow: '0 0 28px rgba(255,59,92,0.9)' };
              tile.style.backgroundColor = style.bg;
              tile.style.color = style.fg;
              tile.style.boxShadow = style.glow;
              if (val >= 1024) tile.style.fontSize = 'clamp(1rem, 3.6vw, 1.55rem)';
              tile.textContent = val;
            }
            this.boardEl.appendChild(tile);
          }
        }
      }

      bindEvents() {
        this.onKeyDown = (e) => {
          const map = {
            ArrowUp: 'UP', KeyW: 'UP',
            ArrowDown: 'DOWN', KeyS: 'DOWN',
            ArrowLeft: 'LEFT', KeyA: 'LEFT',
            ArrowRight: 'RIGHT', KeyD: 'RIGHT'
          };
          if (map[e.code]) {
            e.preventDefault();
            this.move(map[e.code]);
          }
        };

        let sx = 0, sy = 0;
        this.onTouchStart = (e) => {
          if (e.touches.length === 1) {
            sx = e.touches[0].clientX;
            sy = e.touches[0].clientY;
          }
        };
        this.onTouchEnd = (e) => {
          if (!e.changedTouches.length) return;
          const dx = e.changedTouches[0].clientX - sx;
          const dy = e.changedTouches[0].clientY - sy;
          if (Math.max(Math.abs(dx), Math.abs(dy)) < 26) return;
          if (Math.abs(dx) > Math.abs(dy)) {
            this.move(dx > 0 ? 'RIGHT' : 'LEFT');
          } else {
            this.move(dy > 0 ? 'DOWN' : 'UP');
          }
        };

        window.addEventListener('keydown', this.onKeyDown);
        this.boardEl.addEventListener('touchstart', this.onTouchStart, { passive: true });
        this.boardEl.addEventListener('touchend', this.onTouchEnd, { passive: true });
      }

      destroy() {
        window.removeEventListener('keydown', this.onKeyDown);
      }
    }

    /* ========================================================================
       MODULE 7: GAME 4 — AIM & REFLEX TRAINER (30s Round, Accuracy & Reaction)
       ======================================================================== */
    class AimTrainerGame {
      constructor({ mount, hud, controlsGuide, sound, storage, onHighScore }) {
        this.mount = mount;
        this.hud = hud;
        this.controlsGuide = controlsGuide;
        this.sound = sound;
        this.storage = storage;
        this.onHighScore = onHighScore;
        this.gameId = 'aim-trainer';

        this.roundDuration = 30; // seconds
        this.rafId = null;
        this.running = false;
        this.targets = [];
        this.ripples = [];

        this.initDOM();
        this.bindEvents();
        this.reset();
      }

      initDOM() {
        this.controlsGuide.innerHTML =
          '<strong>Controls:</strong> Click or Tap neon targets before they shrink away! Speed and accuracy multiply your score.';

        this.mount.innerHTML = `
          <div style="position:relative; display:flex; align-items:center; justify-content:center; width:100%; height:100%;">
            <canvas id="aimCanvas" class="game-canvas" style="cursor:crosshair;"></canvas>
            <div class="game-overlay" id="aimOverlay">
              <div class="overlay-title" id="aimOverlayTitle">AIM & REFLEX TRAINER</div>
              <p class="overlay-subtitle" id="aimOverlaySub">30-second precision challenge. Hit targets quickly before they collapse!</p>
              <div class="overlay-stats" id="aimOverlayStats" style="display:none;"></div>
              <button type="button" class="btn-play" id="aimStartBtn" style="max-width:210px;">START 30s ROUND</button>
            </div>
          </div>
        `;

        this.canvas = this.mount.querySelector('#aimCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.overlay = this.mount.querySelector('#aimOverlay');
        this.overlayTitle = this.mount.querySelector('#aimOverlayTitle');
        this.overlaySub = this.mount.querySelector('#aimOverlaySub');
        this.overlayStats = this.mount.querySelector('#aimOverlayStats');
        this.startBtn = this.mount.querySelector('#aimStartBtn');

        this.resizeCanvas();
      }

      resizeCanvas() {
        const parent = this.canvas.parentElement;
        this.canvas.width = Math.max(280, Math.min(parent.clientWidth - 12, 760));
        this.canvas.height = Math.max(240, Math.min(parent.clientHeight - 12, 520));
        if (!this.running) this.draw();
      }

      reset() {
        this.running = false;
        this.score = 0;
        this.hits = 0;
        this.misses = 0;
        this.reactionTimes = [];
        this.timeLeft = this.roundDuration;
        this.targets = [];
        this.ripples = [];
        this.lastSpawnTime = 0;

        this.updateHUD();
        this.draw();

        this.overlayTitle.textContent = 'AIM & REFLEX TRAINER';
        this.overlaySub.textContent = '30-second precision challenge. Hit targets quickly before they collapse!';
        this.overlayStats.style.display = 'none';
        this.startBtn.textContent = 'START 30s ROUND';
        this.overlay.classList.remove('hidden');
      }

      start() {
        this.reset();
        this.overlay.classList.add('hidden');
        this.running = true;
        this.startTime = performance.now();
        this.spawnTarget(this.startTime);
        this.sound.play('blip');
        this.loop(this.startTime);
      }

      spawnTarget(now) {
        const margin = 46;
        const W = this.canvas.width;
        const H = this.canvas.height;
        const palette = ['#00f3ff', '#ff00e5', '#00ff9d'];
        const color = palette[Math.floor(Math.random() * palette.length)];

        this.targets.push({
          x: margin + Math.random() * Math.max(20, W - margin * 2),
          y: margin + Math.random() * Math.max(20, H - margin * 2),
          maxR: Math.min(34, Math.max(22, W * 0.048)),
          r: 6,
          born: now,
          life: 1650, // ms lifespan
          color
        });
        this.lastSpawnTime = now;
      }

      getAccuracy() {
        const total = this.hits + this.misses;
        return total === 0 ? 100 : Math.round((this.hits / total) * 100);
      }

      getAvgReaction() {
        if (this.reactionTimes.length === 0) return 0;
        const sum = this.reactionTimes.reduce((a, b) => a + b, 0);
        return Math.round(sum / this.reactionTimes.length);
      }

      updateHUD() {
        const best = this.storage.getHighScore(this.gameId);
        this.hud.innerHTML = `
          <div class="hud-stat"><span class="hud-label">Score</span><span class="hud-value">${this.score}</span></div>
          <div class="hud-stat"><span class="hud-label">Best</span><span class="hud-value best">${best}</span></div>
          <div class="hud-stat"><span class="hud-label">Time</span><span class="hud-value" style="color:#ffb800;">${this.timeLeft.toFixed(1)}s</span></div>
          <div class="hud-stat"><span class="hud-label">Acc</span><span class="hud-value">${this.getAccuracy()}%</span></div>
          <div class="hud-stat"><span class="hud-label">Avg</span><span class="hud-value">${this.getAvgReaction()}ms</span></div>
        `;
      }

      handleShot(clientX, clientY) {
        if (!this.running) return;
        const rect = this.canvas.getBoundingClientRect();
        const x = ((clientX - rect.left) / rect.width) * this.canvas.width;
        const y = ((clientY - rect.top) / rect.height) * this.canvas.height;
        const now = performance.now();

        let hitIndex = -1;
        for (let i = this.targets.length - 1; i >= 0; i--) {
          const t = this.targets[i];
          const dist = Math.hypot(x - t.x, y - t.y);
          if (dist <= t.r + 6) {
            hitIndex = i;
            break;
          }
        }

        if (hitIndex !== -1) {
          const t = this.targets.splice(hitIndex, 1)[0];
          const rt = Math.max(80, Math.round(now - t.born));
          this.reactionTimes.push(rt);
          this.hits++;

          // Faster reaction yields more points
          const speedBonus = Math.max(10, Math.round((1650 - rt) / 25));
          this.score += 25 + speedBonus;

          this.ripples.push({ x: t.x, y: t.y, r: t.r, color: t.color, alpha: 1 });
          this.sound.play('hit');

          const best = this.storage.setHighScore(this.gameId, this.score);
          this.onHighScore(this.gameId, best);

          if (this.targets.length === 0) this.spawnTarget(now);
        } else {
          this.misses++;
          this.ripples.push({ x, y, r: 8, color: '#ff3b5c', alpha: 0.9 });
          this.sound.play('miss');
        }
        this.updateHUD();
      }

      finishRound() {
        this.running = false;
        this.sound.play('win');
        const best = this.storage.setHighScore(this.gameId, this.score);
        this.onHighScore(this.gameId, best);

        this.overlayTitle.textContent = 'ROUND COMPLETE';
        this.overlaySub.textContent = `Hits: ${this.hits} | Misses: ${this.misses}`;
        this.overlayStats.style.display = 'flex';
        this.overlayStats.innerHTML = `
          <div class="hud-stat"><span class="hud-label">Score</span><span class="hud-value">${this.score}</span></div>
          <div class="hud-stat"><span class="hud-label">Accuracy</span><span class="hud-value">${this.getAccuracy()}%</span></div>
          <div class="hud-stat"><span class="hud-label">Reaction</span><span class="hud-value best">${this.getAvgReaction()}ms</span></div>
        `;
        this.startBtn.textContent = 'PLAY AGAIN';
        this.overlay.classList.remove('hidden');
      }

      draw() {
        const ctx = this.ctx;
        const W = this.canvas.width;
        const H = this.canvas.height;

        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, W, H);

        // Subtle crosshair grid
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += 40) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        // Hit/Miss Ripples
        this.ripples.forEach(rp => {
          ctx.save();
          ctx.strokeStyle = rp.color;
          ctx.globalAlpha = rp.alpha;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        });

        // Concentric Neon Targets
        this.targets.forEach(t => {
          ctx.save();
          ctx.shadowColor = t.color;
          ctx.shadowBlur = 16;
          ctx.strokeStyle = t.color;
          ctx.lineWidth = 3;

          ctx.beginPath();
          ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
          ctx.stroke();

          if (t.r > 12) {
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.r * 0.55, 0, Math.PI * 2);
            ctx.stroke();
          }

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(t.x, t.y, Math.min(4.5, t.r * 0.25), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      loop = (now) => {
        if (!this.running) return;

        const elapsed = (now - this.startTime) / 1000;
        this.timeLeft = Math.max(0, this.roundDuration - elapsed);

        if (this.timeLeft <= 0) {
          this.updateHUD();
          this.finishRound();
          return;
        }

        // Spawn up to 2 targets concurrently
        if (this.targets.length < 2 && now - this.lastSpawnTime > 650) {
          this.spawnTarget(now);
        }

        // Update target expansion & shrinking curve
        for (let i = this.targets.length - 1; i >= 0; i--) {
          const t = this.targets[i];
          const age = now - t.born;
          if (age >= t.life) {
            this.targets.splice(i, 1);
            this.misses++;
            this.sound.play('miss');
            if (this.targets.length === 0) this.spawnTarget(now);
          } else {
            const progress = age / t.life; // 0 to 1
            // Expand quickly in first 20%, then shrink smoothly
            if (progress < 0.2) {
              t.r = 6 + (t.maxR - 6) * (progress / 0.2);
            } else {
              t.r = t.maxR * (1 - (progress - 0.2) / 0.8);
            }
          }
        }

        // Update ripples
        for (let i = this.ripples.length - 1; i >= 0; i--) {
          const rp = this.ripples[i];
          rp.r += 1.4;
          rp.alpha -= 0.05;
          if (rp.alpha <= 0) this.ripples.splice(i, 1);
        }

        this.updateHUD();
        this.draw();
        this.rafId = requestAnimationFrame(this.loop);
      };

      bindEvents() {
        this.onPointerDown = (e) => {
          if (!this.running) return;
          e.preventDefault();
          this.handleShot(e.clientX, e.clientY);
        };
        this.onResize = () => this.resizeCanvas();

        this.startBtn.addEventListener('click', () => this.start());
        this.canvas.addEventListener('pointerdown', this.onPointerDown);
        window.addEventListener('resize', this.onResize);
      }

      destroy() {
        this.running = false;
        if (this.rafId) cancelAnimationFrame(this.rafId);
        window.removeEventListener('resize', this.onResize);
      }
    }

    /* ========================================================================
       MODULE 8: GAME 5 — MEMORY MATCH (4x4 Neon Grid, Timer, Moves, Star Score)
       ======================================================================== */
    class MemoryMatchGame {
      constructor({ mount, hud, controlsGuide, sound, storage, onHighScore }) {
        this.mount = mount;
        this.hud = hud;
        this.controlsGuide = controlsGuide;
        this.sound = sound;
        this.storage = storage;
        this.onHighScore = onHighScore;
        this.gameId = 'memory-match';

        this.symbols = ['⚡', '💎', '🚀', '👾', '🔥', '🔮', '🎯', '🛸'];
        this.timerInterval = null;

        this.initDOM();
        this.reset();
      }

      initDOM() {
        this.controlsGuide.innerHTML =
          '<strong>Controls:</strong> Click or Tap cards to flip and match all 8 neon pairs in as few moves and seconds as possible.';

        this.mount.innerHTML = `
          <div style="position:relative; display:flex; align-items:center; justify-content:center;">
            <div class="memory-grid" id="memoryGrid"></div>
            <div class="game-overlay hidden" id="memoryOverlay">
              <div class="overlay-title" id="memoryTitle">GRID CLEARED!</div>
              <p class="overlay-subtitle" id="memorySub">All 8 neural pairs matched.</p>
              <div class="overlay-stats" id="memoryStats"></div>
              <button type="button" class="btn-play" id="memoryReplayBtn" style="max-width:200px;">PLAY AGAIN</button>
            </div>
          </div>
        `;

        this.gridEl = this.mount.querySelector('#memoryGrid');
        this.overlay = this.mount.querySelector('#memoryOverlay');
        this.overlayTitle = this.mount.querySelector('#memoryTitle');
        this.overlaySub = this.mount.querySelector('#memorySub');
        this.overlayStats = this.mount.querySelector('#memoryStats');
        this.replayBtn = this.mount.querySelector('#memoryReplayBtn');

        this.replayBtn.addEventListener('click', () => this.reset());
      }

      reset() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = null;
        this.moves = 0;
        this.seconds = 0;
        this.matchedPairs = 0;
        this.flipped = [];
        this.locked = false;
        this.started = false;

        this.overlay.classList.add('hidden');

        // Shuffle 8 pairs (16 cards)
        const deck = [...this.symbols, ...this.symbols]
          .map(sym => ({ sym, sort: Math.random() }))
          .sort((a, b) => a.sort - b.sort)
          .map(item => item.sym);

        this.gridEl.innerHTML = '';
        deck.forEach((symbol, index) => {
          const card = document.createElement('div');
          card.className = 'mem-card';
          card.dataset.symbol = symbol;
          card.dataset.index = index;
          card.innerHTML = `
            <div class="mem-face mem-front">?</div>
            <div class="mem-face mem-back">${symbol}</div>
          `;
          card.addEventListener('click', () => this.flipCard(card));
          this.gridEl.appendChild(card);
        });

        this.updateHUD();
      }

      startTimer() {
        if (this.started) return;
        this.started = true;
        this.timerInterval = setInterval(() => {
          this.seconds++;
          this.updateHUD();
        }, 1000);
      }

      getStarRating() {
        if (this.moves <= 13 && this.seconds <= 35) return 3;
        if (this.moves <= 19 && this.seconds <= 60) return 2;
        return 1;
      }

      calculateScore() {
        const stars = this.getStarRating();
        const efficiency = Math.max(100, 1200 - (this.moves * 25) - (this.seconds * 5));
        return efficiency + stars * 200;
      }

      updateHUD() {
        const best = this.storage.getHighScore(this.gameId);
        const stars = '★'.repeat(this.getStarRating()) + '☆'.repeat(3 - this.getStarRating());
        this.hud.innerHTML = `
          <div class="hud-stat"><span class="hud-label">Moves</span><span class="hud-value">${this.moves}</span></div>
          <div class="hud-stat"><span class="hud-label">Time</span><span class="hud-value">${this.seconds}s</span></div>
          <div class="hud-stat"><span class="hud-label">Rating</span><span class="hud-value" style="color:#ffb800;">${stars}</span></div>
          <div class="hud-stat"><span class="hud-label">Best</span><span class="hud-value best">${best}</span></div>
        `;
      }

      flipCard(card) {
        if (this.locked) return;
        if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

        this.startTimer();
        card.classList.add('flipped');
        this.sound.play('flip');
        this.flipped.push(card);

        if (this.flipped.length === 2) {
          this.moves++;
          this.updateHUD();
          const [c1, c2] = this.flipped;

          if (c1.dataset.symbol === c2.dataset.symbol) {
            c1.classList.add('matched');
            c2.classList.add('matched');
            this.flipped = [];
            this.matchedPairs++;
            this.sound.play('match');

            if (this.matchedPairs === this.symbols.length) {
              this.handleWin();
            }
          } else {
            this.locked = true;
            setTimeout(() => {
              c1.classList.remove('flipped');
              c2.classList.remove('flipped');
              this.flipped = [];
              this.locked = false;
            }, 680);
          }
        }
      }

      handleWin() {
        clearInterval(this.timerInterval);
        this.sound.play('win');
        const stars = this.getStarRating();
        const starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);
        const finalScore = this.calculateScore();
        const best = this.storage.setHighScore(this.gameId, finalScore);
        this.onHighScore(this.gameId, best);
        this.updateHUD();

        this.overlayTitle.textContent = `VICTORY! ${starStr}`;
        this.overlaySub.textContent = `Completed in ${this.moves} moves and ${this.seconds} seconds.`;
        this.overlayStats.innerHTML = `
          <div class="hud-stat"><span class="hud-label">Score</span><span class="hud-value">${finalScore}</span></div>
          <div class="hud-stat"><span class="hud-label">Best Score</span><span class="hud-value best">${best}</span></div>
        `;
        this.overlay.classList.remove('hidden');
      }

      destroy() {
        if (this.timerInterval) clearInterval(this.timerInterval);
      }
    }

    /* ========================================================================
       MODULE 9: GAME CATALOG REGISTRY (Add New Games Here Effortlessly)
       ======================================================================== */
    const ARCADE_GAMES = [
      {
        id: 'snake',
        title: 'Neon Snake',
        categories: ['Retro', 'Action'],
        tags: ['snake', 'classic', 'arcade', 'grid', 'speed'],
        description: 'Guide your glowing cyber-serpent across the grid, devouring energy orbs as speed ramps up.',
        GameClass: NeonSnakeGame
      },
      {
        id: 'brick-breaker',
        title: 'Brick Breaker',
        categories: ['Action', 'Retro'],
        tags: ['breakout', 'paddle', 'ball', 'powerups', 'bricks'],
        description: 'Shatter multi-layered neon brick walls and catch falling power-up capsules across escalating levels.',
        GameClass: BrickBreakerGame
      },
      {
        id: 'game-2048',
        title: '2048 Neon',
        categories: ['Puzzle'],
        tags: ['numbers', 'tiles', 'merge', 'strategy', 'logic'],
        description: 'Slide and fuse matching energy tiles on a 4x4 matrix to forge the luminous 2048 core.',
        GameClass: Game2048
      },
      {
        id: 'aim-trainer',
        title: 'Aim & Reflex Trainer',
        categories: ['Reflex', 'Action'],
        tags: ['aim', 'fps', 'reaction', 'click', 'speed', 'targets'],
        description: 'Test your precision and reaction milliseconds in a fast-paced 30-second shrinking target gauntlet.',
        GameClass: AimTrainerGame
      },
      {
        id: 'memory-match',
        title: 'Memory Match',
        categories: ['Puzzle', 'Reflex'],
        tags: ['cards', 'pairs', 'brain', 'flip', 'matching'],
        description: 'Flip and pair all 8 glowing cyber-icons against the clock to earn a 3-star master rating.',
        GameClass: MemoryMatchGame
      }
    ];

    /* ========================================================================
       MODULE 10: ARCADE HUB CONTROLLER (Filtering, Favorites, Stage Lifecycle)
       ======================================================================== */
    class ArcadeHubApp {
      constructor() {
        this.storage = new StorageManager();
        this.sound = new SoundEngine(this.storage);

        this.state = {
          search: '',
          category: 'All',
          onlyFavorites: false,
          favorites: this.storage.getFavorites(),
          activeGameInstance: null
        };

        this.cacheDOM();
        this.syncSoundButtonUI();
        this.updateFavBadge();
        this.bindEvents();
        this.renderGrid();
      }

      cacheDOM() {
        this.searchInput = document.getElementById('searchInput');
        this.searchClearBtn = document.getElementById('searchClearBtn');
        this.favFilterBtn = document.getElementById('favFilterBtn');
        this.favCountBadge = document.getElementById('favCountBadge');
        this.categoryBar = document.getElementById('categoryBar');
        this.gamesGrid = document.getElementById('gamesGrid');
        this.hubResultsLabel = document.getElementById('hubResultsLabel');
        this.logoResetBtn = document.getElementById('logoResetBtn');

        // Stage Elements
        this.gameStage = document.getElementById('gameStage');
        this.stageGameTitle = document.getElementById('stageGameTitle');
        this.stageHud = document.getElementById('stageHud');
        this.gameMount = document.getElementById('gameMount');
        this.stageControlsGuide = document.getElementById('stageControlsGuide');
        this.backToHubBtn = document.getElementById('backToHubBtn');
        this.restartGameBtn = document.getElementById('restartGameBtn');
        this.soundToggleBtn = document.getElementById('soundToggleBtn');
        this.soundIconOn = document.getElementById('soundIconOn');
        this.soundIconOff = document.getElementById('soundIconOff');
        this.soundLabel = document.getElementById('soundLabel');
      }

      bindEvents() {
        // Live search input
        this.searchInput.addEventListener('input', (e) => {
          this.state.search = e.target.value.trim().toLowerCase();
          this.searchClearBtn.classList.toggle('visible', this.state.search.length > 0);
          this.renderGrid();
        });

        this.searchClearBtn.addEventListener('click', () => {
          this.searchInput.value = '';
          this.state.search = '';
          this.searchClearBtn.classList.remove('visible');
          this.renderGrid();
        });

        // Favorites filter toggle
        this.favFilterBtn.addEventListener('click', () => {
          this.state.onlyFavorites = !this.state.onlyFavorites;
          this.favFilterBtn.classList.toggle('active', this.state.onlyFavorites);
          this.favFilterBtn.setAttribute('aria-pressed', String(this.state.onlyFavorites));
          this.sound.play('blip');
          this.renderGrid();
        });

        // Category pills
        this.categoryBar.addEventListener('click', (e) => {
          const pill = e.target.closest('.cat-pill');
          if (!pill) return;
          this.state.category = pill.dataset.category;
          this.categoryBar.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          this.sound.play('blip');
          this.renderGrid();
        });

        // Logo reset
        this.logoResetBtn.addEventListener('click', (e) => {
          e.preventDefault();
          this.resetFilters();
        });

        // Stage controls
        this.backToHubBtn.addEventListener('click', () => this.closeGame());
        this.restartGameBtn.addEventListener('click', () => {
          if (this.state.activeGameInstance && typeof this.state.activeGameInstance.reset === 'function') {
            this.sound.play('blip');
            this.state.activeGameInstance.reset();
          }
        });
        this.soundToggleBtn.addEventListener('click', () => {
          this.sound.toggleMute();
          this.syncSoundButtonUI();
        });

        // Escape key closes active game stage
        window.addEventListener('keydown', (e) => {
          if (e.code === 'Escape' && this.gameStage.classList.contains('open')) {
            this.closeGame();
          }
        });
      }

      resetFilters() {
        this.state.search = '';
        this.state.category = 'All';
        this.state.onlyFavorites = false;
        this.searchInput.value = '';
        this.searchClearBtn.classList.remove('visible');
        this.favFilterBtn.classList.remove('active');
        this.categoryBar.querySelectorAll('.cat-pill').forEach(p => {
          p.classList.toggle('active', p.dataset.category === 'All');
        });
        this.renderGrid();
      }

      syncSoundButtonUI() {
        const muted = this.sound.muted;
        this.soundToggleBtn.classList.toggle('muted', muted);
        this.soundIconOn.style.display = muted ? 'none' : 'block';
        this.soundIconOff.style.display = muted ? 'block' : 'none';
        this.soundLabel.textContent = muted ? 'Muted' : 'Sound On';
      }

      updateFavBadge() {
        this.favCountBadge.textContent = this.state.favorites.length;
      }

      getFilteredGames() {
        return ARCADE_GAMES.filter(game => {
          if (this.state.onlyFavorites && !this.state.favorites.includes(game.id)) {
            return false;
          }
          if (this.state.category !== 'All' && !game.categories.includes(this.state.category)) {
            return false;
          }
          if (this.state.search) {
            const q = this.state.search;
            const inTitle = game.title.toLowerCase().includes(q);
            const inDesc = game.description.toLowerCase().includes(q);
            const inTags = game.tags.some(t => t.includes(q));
            const inCats = game.categories.some(c => c.toLowerCase().includes(q));
            return inTitle || inDesc || inTags || inCats;
          }
          return true;
        });
      }

      renderGrid() {
        const filtered = this.getFilteredGames();
        this.hubResultsLabel.textContent =
          filtered.length === ARCADE_GAMES.length
            ? `Showing all ${ARCADE_GAMES.length} free-to-play arcade games`
            : `Showing ${filtered.length} of ${ARCADE_GAMES.length} games`;

        this.gamesGrid.innerHTML = '';

        if (filtered.length === 0) {
          this.gamesGrid.innerHTML = `
            <div class="empty-state">
              <h3>NO GAMES FOUND</h3>
              <p>No arcade cabinets matched your current search or filter criteria.</p>
              <button type="button" class="btn-reset-filters" id="emptyResetBtn">Reset All Filters</button>
            </div>
          `;
          this.gamesGrid.querySelector('#emptyResetBtn').addEventListener('click', () => this.resetFilters());
          return;
        }

        filtered.forEach(game => {
          const isFav = this.state.favorites.includes(game.id);
          const bestScore = this.storage.getHighScore(game.id);

          const card = document.createElement('article');
          card.className = 'game-card';
          card.innerHTML = `
            <div class="card-thumb-wrap">
              <canvas></canvas>
              <div class="thumb-badges">
                <div class="category-badges">
                  ${game.categories.map(c => `<span class="badge-cat">${c}</span>`).join('')}
                </div>
                <span class="badge-highscore" data-hs-badge="${game.id}" title="Personal Best">
                  ★ ${bestScore}
                </span>
              </div>
            </div>
            <div class="card-body">
              <h3 class="card-title">${game.title}</h3>
              <p class="card-desc">${game.description}</p>
              <div class="card-footer">
                <button type="button" class="btn-play" data-play="${game.id}">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3" />
                  </svg>
                  PLAY
                </button>
                <button type="button" class="btn-fav ${isFav ? 'is-fav' : ''}" data-fav="${game.id}" aria-label="Favorite ${game.title}" title="Toggle Favorite">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                  </svg>
                </button>
              </div>
            </div>
          `;

          // Render procedural neon thumbnail
          renderThumbnail(card.querySelector('canvas'), game.id);

          // Play button
          card.querySelector('[data-play]').addEventListener('click', () => this.launchGame(game));

          // Favorite button
          card.querySelector('[data-fav]').addEventListener('click', () => {
            this.state.favorites = this.storage.toggleFavorite(game.id);
            this.updateFavBadge();
            this.sound.play('blip');
            this.renderGrid();
          });

          this.gamesGrid.appendChild(card);
        });
      }

      launchGame(gameConfig) {
        if (this.state.activeGameInstance) {
          this.state.activeGameInstance.destroy();
          this.state.activeGameInstance = null;
        }

        this.sound.initContext();
        this.sound.play('blip');

        this.stageGameTitle.textContent = gameConfig.title.toUpperCase();
        this.stageHud.innerHTML = '';
        this.gameMount.innerHTML = '';
        this.stageControlsGuide.innerHTML = '';

        this.gameStage.classList.add('open');
        document.body.classList.add('stage-open');

        this.state.activeGameInstance = new gameConfig.GameClass({
          mount: this.gameMount,
          hud: this.stageHud,
          controlsGuide: this.stageControlsGuide,
          sound: this.sound,
          storage: this.storage,
          onHighScore: (gameId, newBest) => {
            const badge = document.querySelector(`[data-hs-badge="${gameId}"]`);
            if (badge) badge.textContent = `★ ${newBest}`;
          }
        });
      }

      closeGame() {
        if (this.state.activeGameInstance) {
          this.state.activeGameInstance.destroy();
          this.state.activeGameInstance = null;
        }
        this.sound.play('blip');
        this.gameStage.classList.remove('open');
        document.body.classList.remove('stage-open');
        this.gameMount.innerHTML = '';
        this.renderGrid();
      }
    }

    // Boot NEON ARCADE once DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      window.neonArcade = new ArcadeHubApp();
    });
  </script>
</body>
